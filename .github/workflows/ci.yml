name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: featureboard
          POSTGRES_USER: featureboard
          POSTGRES_PASSWORD: featureboard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U featureboard -d featureboard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://featureboard:featureboard@127.0.0.1:5432/featureboard?schema=public
      SESSION_COOKIE_SECURE: "false"
      SEED_PASSWORD: ChangeMe123!
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:deploy
      - run: npm run db:seed
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
